model:
  architecture: xlstm
  parameters:
    model_size: 128
    stack:
      num_blocks: 7
      slstm_block_indices:
      - 1
      mlstm_num_heads: 4
      slstm_num_heads: 4
      mlstm_expansion: 2
      projection_block_size: 4
      convolution_size: 4
      feedforward_factor: 1.3
      dropout: 0.0
    head:
      pooling: last
      dropout: 0.0
