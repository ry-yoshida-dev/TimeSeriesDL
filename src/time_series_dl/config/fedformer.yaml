model:
  architecture: fedformer
  parameters:
    model_size: 512
    num_heads: 8
    num_encoder_layers: 2
    num_decoder_layers: 1
    feedforward_size: 2048
    moving_average_size: 25
    modes: 64
    mode_selection: random
    dropout: 0.05
    activation: gelu
    label_length: 48
    head:
      pooling: mean
      dropout: 0.0
